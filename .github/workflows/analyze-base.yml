name: Decompile and inspect base.apk with REA
on:
  workflow_dispatch:
  push:
    branches: [arena/3a37ecd7-rea]
    paths:
      - base.apk
      - .github/workflows/analyze-base.yml
      - scripts/decompile_base.sh
      - scripts/export_base.py
      - scripts/run_rea.sh
      - scripts/verify_base.py
      - scripts/inspect_base.py
permissions:
  contents: read
jobs:
  analyze:
    if: github.ref == 'refs/heads/arena/3a37ecd7-rea'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v5
        with:
          node-version: '22.22.3'
      - name: Install checksum-verified decompilers and pinned REA
        run: |
          mkdir -p .tools/jadx .work
          curl -fL --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o .tools/jadx.zip
          echo '545ea2be9c242511bc145755cf4bda2485ade42966e096f8b4d3da2a230e8974  .tools/jadx.zip' | sha256sum -c -
          unzip -q .tools/jadx.zip -d .tools/jadx
          curl -fL --retry 3 https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -o .tools/apktool.jar
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  .tools/apktool.jar' | sha256sum -c -
          curl -fL --retry 3 https://github.com/1013503897/jadx-headless-mcp/releases/download/v0.7.1/jadx-headless-mcp-0.7.1-all.jar -o .tools/jadx-headless-mcp.jar
          echo '6e5eacf500b64292bfb73c49797c1958f6ee44646e43e868039ae7feb573ff75  .tools/jadx-headless-mcp.jar' | sha256sum -c -
          printf '#!/usr/bin/env bash\nexec java -jar "%s/.tools/apktool.jar" "$@"\n' "$PWD" > .tools/apktool
          chmod +x .tools/apktool
          npm install --prefix .tools/rea-client --ignore-scripts --no-audit --no-fund rea-agents@6.5.0
      - name: Decompile the new input (never execute the APK)
        run: bash scripts/decompile_base.sh
      - name: Inspect with REA and retain evidence and exit codes
        run: bash scripts/run_rea.sh
      - name: Verify export integrity
        run: |
          python3 scripts/verify_base.py
          python3 scripts/inspect_base.py
      - name: Upload complete analysis
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: base-apk-analysis-${{ github.run_number }}
          path: |
            decompiled/
            analysis/
            .work/base-analysis/*.log
          retention-days: 14
      - name: Commit decompilation and REA evidence to session branch
        run: |
          mkdir -p analysis
          printf 'Run: https://github.com/JCVERSA/rea/actions/runs/%s\nSource commit: %s\nNo APK execution, rebuild or signing performed.\n' '${{ github.run_id }}' '${{ github.sha }}' > analysis/build.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add decompiled analysis
          if ! git diff --cached --quiet; then
            git commit -m "Add base.apk decompilation and REA static evidence"
            git push origin HEAD:arena/3a37ecd7-rea
          fi
