name: Cantas - independent native alpha
on:
  workflow_dispatch:
  push:
    branches: [arena/3a37ecd7-rea]
    paths: ['cantas/**', '.github/workflows/cantas.yml', 'scripts/cantas_*']
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/arena/3a37ecd7-rea'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform and pin Gradle distribution checksum
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          mkdir -p cantas/reports
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-8.11.1-bin.zip.sha256 -o cantas/reports/gradle-distribution.sha256
          checksum=$(tr -d '\r\n' < cantas/reports/gradle-distribution.sha256)
          [[ "$checksum" =~ ^[0-9a-f]{64}$ ]]
          pinned=$(sed -n 's/^distributionSha256Sum=//p' cantas/gradle/wrapper/gradle-wrapper.properties)
          if [[ -n "$pinned" ]]; then
            [[ "$checksum" == "$pinned" ]] || { echo 'Gradle checksum differs from source pin'; exit 1; }
          else
            printf '\ndistributionSha256Sum=%s\n' "$checksum" >> cantas/gradle/wrapper/gradle-wrapper.properties
          fi
          sha256sum cantas/gradle/wrapper/gradle-wrapper.jar > cantas/reports/wrapper.sha256
      - name: Unit tests, lint and APK assembly
        working-directory: cantas
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Verify APK identity and signature
        run: |
          apk=cantas/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk" > cantas/reports/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > cantas/reports/package.txt
          grep -q "name='app.cantas.jcversa'" cantas/reports/package.txt
          sha256sum "$apk" > cantas/reports/APK_SHA256
          python3 scripts/cantas_contract.py "$apk" 2>&1 | tee cantas/reports/contract.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: Cantas-build-reports-${{ github.run_id }}
          path: |
            cantas/reports/
            cantas/app/build/reports/
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: internal-Cantas-test-input-${{ github.run_id }}
          path: |
            cantas/app/build/outputs/apk/debug/app-debug.apk
            cantas/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 2
  android:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 24
            arch: x86
          - api: 31
            arch: x86_64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: internal-Cantas-test-input-${{ github.run_id }}
          path: .work/cantas-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: ${{ matrix.arch }}
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 scripts/cantas_smoke.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: Cantas-Android-${{ matrix.api }}-${{ github.run_id }}
          path: .work/cantas-reports/
          retention-days: 14
  deliver:
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: internal-Cantas-test-input-${{ github.run_id }}
          path: input
      - name: Name clearly as TEST
        run: |
          mkdir delivery
          cp input/debug/app-debug.apk delivery/Cantas-0.7.0-alpha07-TEST.apk
          sha256sum delivery/*.apk > delivery/SHA256SUMS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: TEST-Cantas-${{ github.run_id }}
          path: delivery/
          retention-days: 14

  publish:
    needs: [build, android]
    if: always() && !cancelled() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: rea-evidence-publish-arena-3a37ecd7-rea
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: arena/3a37ecd7-rea
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: Cantas-build-reports-${{ github.run_id }}
          path: analysis/cantas/${{ github.run_id }}/build
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        if: needs.android.result != 'skipped'
        with:
          pattern: Cantas-Android-*-${{ github.run_id }}
          path: analysis/cantas/${{ github.run_id }}/android
      - name: Record reports only, never private signing material
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/cantas
          git commit -m 'Record Cantas alpha build and isolated Android verification'
          git push origin HEAD:arena/3a37ecd7-rea
