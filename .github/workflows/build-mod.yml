name: Build cleaned File Manager test APK
on:
  workflow_dispatch:
  push:
    branches: [arena/3a37ecd7-rea]
    paths:
      - .github/workflows/build-mod.yml
      - scripts/prepare_mod.py
      - scripts/test_mod.py
      - scripts/verify_built_mod.py
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/arena/3a37ecd7-rea'
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify reference exports and regression tests
        run: |
          python3 scripts/verify_decompilation.py
          python3 scripts/test_mod.py -v
      - name: Install build tools
        run: |
          mkdir -p .tools .work delivery
          curl -fL --retry 3 https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -o .tools/apktool.jar
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
      - name: Prepare isolated patch and rebuild
        run: |
          python3 scripts/prepare_mod.py .work/cleaned
          java -Xmx2g -jar .tools/apktool.jar b .work/cleaned -o .work/unsigned.apk 2>&1 | tee .work/build.log
      - name: Align and sign with ephemeral test key
        shell: bash
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/zipalign" -P 16 -f -v 4 .work/unsigned.apk .work/aligned.apk > .work/zipalign.log
          # Deliberately ephemeral: private key/password never leave this runner.
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          export MOD_KEY_PASSWORD="$password"
          keytool -genkeypair -keystore .work/test-signing.p12 -storetype PKCS12 \
            -storepass:env MOD_KEY_PASSWORD -keypass:env MOD_KEY_PASSWORD \
            -alias mod-test -keyalg RSA -keysize 3072 -validity 3650 \
            -dname 'CN=File Manager Mod Test, OU=Personal Testing' > .work/keytool.log 2>&1
          "$tools/apksigner" sign --ks .work/test-signing.p12 --ks-key-alias mod-test \
            --ks-pass env:MOD_KEY_PASSWORD --key-pass env:MOD_KEY_PASSWORD \
            --min-sdk-version 21 --out delivery/file-manager-cleaned-test.apk .work/aligned.apk
          "$tools/apksigner" verify --verbose --print-certs delivery/file-manager-cleaned-test.apk | tee delivery/signature-verification.txt
          "$tools/zipalign" -c -P 16 -v 4 delivery/file-manager-cleaned-test.apk > delivery/alignment-verification.txt
          sha256sum delivery/file-manager-cleaned-test.apk > delivery/APK.sha256
      - name: Decode rebuilt APK and verify patch survives assembly
        run: |
          java -Xmx2g -jar .tools/apktool.jar d -f delivery/file-manager-cleaned-test.apk -o .work/roundtrip > .work/roundtrip.log 2>&1
          python3 scripts/verify_built_mod.py .work/cleaned .work/roundtrip | tee delivery/roundtrip-verification.txt
          cp .work/patch-report.json delivery/
          cp docs/MOD_BUILD.md delivery/README.md
      - name: Upload verified test build
        uses: actions/upload-artifact@v6
        with:
          name: file-manager-cleaned-test-${{ github.run_number }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
      - name: Record public verification evidence on session branch
        env:
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_SOURCE_SHA: ${{ github.sha }}
          BUILD_RUN_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p docs/builds/latest
          cp delivery/signature-verification.txt delivery/roundtrip-verification.txt delivery/APK.sha256 delivery/patch-report.json docs/builds/latest/
          tail -1 delivery/alignment-verification.txt > docs/builds/latest/alignment-verification.txt
          printf 'Run: https://github.com/JCVERSA/rea/actions/runs/%s\nSource commit: %s\nArtifact: file-manager-cleaned-test-%s\nRuntime: NOT VERIFIED\n' "$BUILD_RUN_ID" "$BUILD_SOURCE_SHA" "$BUILD_RUN_NUMBER" > docs/builds/latest/build.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/builds/latest
          git commit -m "Record cleaned APK static verification evidence"
          git push origin HEAD:arena/3a37ecd7-rea
      - name: Upload diagnostic logs (no signing material)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cleaned-build-diagnostics-${{ github.run_number }}
          path: |
            .work/build.log
            .work/zipalign.log
            .work/roundtrip.log
            .work/patch-report.json
          retention-days: 14
